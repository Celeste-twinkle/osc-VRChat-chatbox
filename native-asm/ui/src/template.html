<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VRC Chatbox OSC</title>
    <style>
        /*STYLE*/
    </style>
    <script>
        try { var thm = localStorage.getItem('vrcChatboxTheme'); if (thm !== 'dark' && thm !== 'light') thm = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = thm; } catch (e) {}
    </script>
</head>

<body>
    <main>
        <header>
            <h1>VRC Chatbox OSC</h1>
            <div class="hd">
                <span class="s" id="status">本地服务已连接</span>
                <button class="theme-btn" type="button" id="themeBtn" aria-label="theme"></button>
            </div>
        </header>
        <section class="c">
            <div class="lan">
                <div class="lan-info"><div class="lan-title"><b>局域网访问地址</b><code id="lan">仅本机</code></div><span
                        class="lan-note">可在同一路由其他设备访问，如连接路由器wifi的手机</span></div>
                <div class="lan-actions"><button id="settingsBtn"
                        type="button">设置</button><button id="qrBtn" class="hide" type="button">二维码</button><button
                        id="lanBtn" type="button">允许局域网连接</button></div>
            </div>
            <div id="qrModal" class="modal hide">
                <div class="panel qrpanel">
                    <div class="ph"><b>局域网二维码</b><button id="qrClose" class="x" type="button">关闭</button></div>
                    <div class="qrctrl"><label id="qrHostLabel">二维码地址</label><select id="qrChoice"
                            aria-labelledby="qrHostLabel"></select><input id="qrHost" aria-labelledby="qrHostLabel"
                            placeholder="192.168.1.100:19001"></div><canvas id="qrCanvas" width="264"
                        height="264"></canvas><a id="qrLink" class="qrurl" target="_blank" href="#"></a>
                </div>
            </div>
            <div id="settingsModal" class="modal hide">
                <div class="panel">
                    <div class="ph"><b>设置</b><button id="settingsClose" class="x" type="button">关闭</button></div>
                    <div class="row2">
                        <div><label id="uiLangLabel" for="uiLang">UI 语言</label><select id="uiLang">
                                <option value="auto">Auto</option>
                                <option value="zh">中文</option>
                                <option value="en">English</option>
                                <option value="ja">日本語</option>
                                <option value="ko">한국어</option>
                            </select></div>
                        <div><label id="histLimitLabel" for="histLimit">历史记录上限</label><input
                                id="histLimit" type="number" min="1" max="200" value="100"></div>
                        <div><label id="portLabel" for="port">端口</label><input
                                id="port" type="number" min="1024" max="65535" value="19001"></div>
                        <div><label id="oscPortLabel" for="oscPort">OSC 端口</label><input
                                id="oscPort" type="number" min="1024" max="65535" value="9000"></div>
                    </div><label class="toggle"><input id="startup" type="checkbox">开机自启动</label><label
                        class="toggle sub"><input id="startMinimized" type="checkbox">最小化自启动（开机启动时不打开浏览器）</label><label
                        class="toggle"><input id="trOn" type="checkbox">启用翻译</label><label class="toggle"><input
                            id="notifySfx" type="checkbox" checked>提示音</label>
                    <div id="trBox" class="hide">
                        <div class="row2">
                            <div><label id="settingsSrcLabel" for="settingsSrc">源语言</label><select
                                    id="settingsSrc"></select></div>
                            <div><label id="settingsDstLabel" for="settingsDst">目标语言</label><select
                                    id="settingsDst"></select></div>
                        </div>
                        <div class="row3">
                            <div><label id="settingsFmtLabel" for="settingsFmt">翻译格式</label><select
                                    id="settingsFmt"></select></div>
                            <div><label id="settingsOrderLabel" for="settingsOrder">双语顺序</label><select
                                    id="settingsOrder">
                                    <option value="source-first">原文 → 译文</option>
                                    <option value="translation-first">译文 → 原文</option>
                                </select></div>
                            <div><label id="providerLabel" for="provider">翻译服务</label><select id="provider">
                                    <option value="mymemory">MyMemory 免费公开 API</option>
                                    <option value="openai">ChatGPT / OpenAI</option>
                                    <option value="deepseek">DeepSeek</option>
                                    <option value="hunyuan">腾讯混元</option>
                                    <option value="custom">自定义 OpenAI 兼容 API</option>
                                </select></div>
                        </div>
                        <div class="warn">Key 会保存到本机 settings.json。不要把这个文件复制或发送给任何人。若 MyMemory 翻译失败或提示额度不足，请尝试填写
                            email，或自行获取 key 后使用。</div>
                        <div id="mmBox" class="row"><input id="mmEmail" aria-label="MyMemory email，可提升免费额度"
                                placeholder="MyMemory email，可提升免费额度"><input id="mmKey" aria-label="MyMemory key，可选"
                                placeholder="MyMemory key，可选"><a class="linkbtn" target="_blank"
                                href="https://mymemory.translated.net/doc/keygen.php">获取 MyMemory key</a></div>
                        <div id="aiBox" class="hide">
                            <div class="row"><input id="endpoint" aria-label="AI Base URL"
                                    placeholder="AI Base URL，例如 https://api.openai.com/v1"><input id="model"
                                    aria-label="AI 模型" placeholder="模型，例如 gpt-4o-mini / deepseek-chat"><input id="key"
                                    aria-label="AI API Key" placeholder="AI API Key"></div>
                            <label class="toggle ai-correct"><input id="aiCorrect" type="checkbox">翻译前纠正原文</label>
                            <div id="aiCorrectHint" class="option-note">仅纠正明确的错别字、拼写和语法，保留原意、语气、专名与俚语。</div>
                            <div class="glossary-field">
                                <label id="glossaryLabel" for="aiGlossary">术语词库</label>
                                <textarea id="aiGlossary" maxlength="2000" aria-describedby="glossaryHint"
                                    placeholder="每行一个术语；可用 原文 => 译文 指定翻译">VRChat
VRC
VRChat+
VRC+
VRCat
VRRat
VRChat Credits
VRChat SDK
VRCSDK
SDK3
Avatars 3.0
VRChat Creator Companion
Creator Companion
VCC
VRChat Package Manager
VPM
VRC Quick Launcher
VRCQL
Udon
UdonSharp
U#
ClientSim
Avatar Dynamics
PhysBones
VRC Constraints
Expressions Menu
Expression Parameters
OSC
Chatbox
FBT</textarea>
                                <div id="glossaryHint" class="field-note">AI 会优先使用词库纠正语音识别错误并保持术语翻译一致。</div>
                            </div>
                            <div class="prompt-manager">
                                <label id="promptLabel" for="promptSelect">AI 提示词</label>
                                <div class="prompt-actions"><select id="promptSelect"></select><button id="promptNew"
                                        class="x" type="button">新建</button><button id="promptSave"
                                        type="button">保存</button><button id="promptDelete" class="r"
                                        type="button">删除</button></div>
                                <div id="promptEditor" class="prompt-editor hide">
                                    <div><label id="promptNameLabel" for="promptName">提示词名称</label><input id="promptName"
                                            maxlength="48" placeholder="提示词名称"></div>
                                    <div><label id="promptContentLabel" for="promptContent">提示词内容</label><textarea
                                            id="promptContent" maxlength="2500" placeholder="提示词内容"></textarea></div>
                                </div>
                                <div class="prompt-meta"><div id="promptHint" class="prompt-hint"></div><div
                                        id="promptSaveStatus" class="prompt-status" aria-live="polite"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="quickTr" class="quick hide">
                <div><label id="srcLabel" for="src">源语言</label><select id="src">
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                    </select></div>
                <div><label id="dstLabel" for="dst">目标语言</label><select id="dst">
                        <option value="en">English</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                    </select></div>
                <div><label id="fmtLabel" for="fmt">翻译格式</label><select id="fmt">
                        <option value="both">原文 + 译文</option>
                        <option value="trans">仅译文</option>
                        <option value="orig">仅原文（不翻译）</option>
                    </select></div>
                <div><label id="orderLabel" for="bothOrder">双语顺序</label><select id="bothOrder">
                        <option value="source-first">原文 → 译文</option>
                        <option value="translation-first">译文 → 原文</option>
                    </select></div>
            </div>
            <div class="wrap"><textarea id="text" autofocus aria-label="输入要发送到 VRChat Chatbox 的文字"
                    placeholder="输入要直接发送到 VRChat Chatbox 的文字。"></textarea><span
                    id="cnt" class="cnt">0/144</span></div>
            <div class="a">
                <div class="h" id="hint">Enter 发送，Shift + Enter 换行</div>
                <div class="sends"><button id="trButton" class="send-tr" type="button">翻译发送</button><button
                        id="button" class="send-direct" type="button">发送</button></div>
                <div class="rw"><button id="clearBubble" class="g" type="button">清除气泡</button><button id="clearBtn"
                        class="r" type="button">清空</button></div>
            </div>
            <div class="m" id="message"></div>
            <div class="hscroll">
                <div id="hbar" class="hbar hide"><button id="clearHistory" class="r" type="button">清空历史</button><button
                        id="exportHistory" class="x" type="button">导出历史</button></div>
                <div id="hnote" class="hnote hide"></div>
                <div id="hlist" class="hlist"></div>
            </div>
        </section>
    </main>
    <script>
        /*SCRIPT*/
    </script>

</html>
