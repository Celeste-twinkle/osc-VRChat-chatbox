<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VRC Chatbox OSC</title>
    <style>
        /*STYLE*/
    </style>
    <script>
        try { var thm = localStorage.getItem('vrcChatboxTheme'); if (thm !== 'dark' && thm !== 'light') thm = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = thm; } catch (e) {}
    </script>
</head>

<body>
    <main>
        <header>
            <h1>VRC Chatbox OSC</h1>
            <div class="hd">
                <span class="s" id="status">本地服务已连接</span>
                <button class="theme-btn" type="button" id="themeBtn" aria-label="theme"></button>
            </div>
        </header>
        <section class="c">
            <div class="lan">
                <div class="lan-info"><div class="lan-title"><b>局域网访问地址</b><code id="lan">仅本机</code></div><span
                        class="lan-note">可在同一路由其他设备访问，如连接路由器wifi的手机</span></div>
                <div class="lan-actions"><button id="settingsBtn"
                        type="button">设置</button><button id="qrBtn" class="hide" type="button">二维码</button><button
                        id="lanBtn" type="button">允许局域网连接</button></div>
            </div>
            <div id="qrModal" class="modal hide">
                <div class="panel qrpanel">
                    <div class="ph"><b>局域网二维码</b><button id="qrClose" class="x" type="button">关闭</button></div>
                    <div class="qrctrl"><label id="qrHostLabel">二维码地址</label><select id="qrChoice"></select><input
                            id="qrHost" placeholder="192.168.1.100:19001"></div><canvas id="qrCanvas" width="264"
                        height="264"></canvas><a id="qrLink" class="qrurl" target="_blank" href="#"></a>
                </div>
            </div>
            <div id="settingsModal" class="modal hide">
                <div class="panel">
                    <div class="ph"><b>设置</b><button id="settingsClose" class="x" type="button">关闭</button></div>
                    <div class="row2">
                        <div><label id="uiLangLabel">UI 语言</label><select id="uiLang">
                                <option value="auto">Auto</option>
                                <option value="zh">中文</option>
                                <option value="en">English</option>
                                <option value="ja">日本語</option>
                                <option value="ko">한국어</option>
                            </select></div>
                        <div><label id="histLimitLabel">历史记录上限</label><input
                                id="histLimit" type="number" min="1" max="200" value="100"></div>
                        <div><label id="portLabel">端口</label><input
                                id="port" type="number" min="1024" max="65535" value="19001"></div>
                        <div><label id="oscPortLabel">OSC 端口</label><input
                                id="oscPort" type="number" min="1024" max="65535" value="9000"></div>
                    </div><label class="toggle"><input id="startup" type="checkbox">开机自启动</label><label
                        class="toggle sub"><input id="startMinimized" type="checkbox">最小化自启动（开机启动时不打开浏览器）</label><label
                        class="toggle"><input id="trOn" type="checkbox">启用翻译</label><label class="toggle"><input
                            id="notifySfx" type="checkbox" checked>提示音</label>
                    <div id="trBox" class="hide">
                        <div class="row2">
                            <div><label id="settingsSrcLabel">源语言</label><select
                                    id="settingsSrc"></select></div>
                            <div><label id="settingsDstLabel">目标语言</label><select
                                    id="settingsDst"></select></div>
                        </div>
                        <div class="row2">
                            <div><label id="settingsFmtLabel">翻译格式</label><select
                                    id="settingsFmt"></select></div>
                            <div><label id="providerLabel">翻译服务</label><select id="provider">
                                    <option value="mymemory">MyMemory 免费公开 API</option>
                                    <option value="openai">ChatGPT / OpenAI</option>
                                    <option value="deepseek">DeepSeek</option>
                                    <option value="hunyuan">腾讯混元</option>
                                    <option value="custom">自定义 OpenAI 兼容 API</option>
                                </select></div>
                        </div>
                        <div class="warn">Key 会保存到本机 settings.json。不要把这个文件复制或发送给任何人。若 MyMemory 翻译失败或提示额度不足，请尝试填写
                            email，或自行获取 key 后使用。</div>
                        <div id="mmBox" class="row"><input id="mmEmail" placeholder="MyMemory email，可提升免费额度"><input
                                id="mmKey" placeholder="MyMemory key，可选"><a class="linkbtn" target="_blank"
                                href="https://mymemory.translated.net/doc/keygen.php">获取 MyMemory key</a></div>
                        <div id="aiBox" class="row hide"><input id="endpoint"
                                placeholder="AI Base URL，例如 https://api.openai.com/v1"><input id="model"
                                placeholder="模型，例如 gpt-4o-mini / deepseek-chat"><input id="key"
                                placeholder="AI API Key"></div>
                    </div>
                </div>
            </div>
            <div id="quickTr" class="quick hide">
                <div><label id="srcLabel">源语言</label><select id="src">
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                    </select></div>
                <div><label id="dstLabel">目标语言</label><select id="dst">
                        <option value="en">English</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                    </select></div>
                <div><label id="fmtLabel">翻译格式</label><select id="fmt">
                        <option value="both">原文 + 译文</option>
                        <option value="trans">仅译文</option>
                        <option value="orig">仅原文（不翻译）</option>
                    </select></div>
            </div>
            <div class="wrap"><textarea id="text" autofocus placeholder="输入要直接发送到 VRChat Chatbox 的文字。"></textarea><span
                    id="cnt" class="cnt">0/144</span></div>
            <div class="a">
                <div class="h" id="hint">Enter 发送，Shift + Enter 换行</div>
                <div class="sends"><button id="trButton" class="send-tr" type="button">翻译发送</button><button
                        id="button" class="send-direct" type="button">发送</button></div>
                <div class="rw"><button id="clearBubble" class="g" type="button">清除气泡</button><button id="clearBtn"
                        class="r" type="button">清空</button></div>
            </div>
            <div class="m" id="message"></div>
            <div class="hscroll">
                <div id="hbar" class="hbar hide"><button id="clearHistory" class="r" type="button">清空历史</button><button
                        id="exportHistory" class="x" type="button">导出历史</button></div>
                <div id="hnote" class="hnote hide"></div>
                <div id="hlist" class="hlist"></div>
            </div>
        </section>
    </main>
    <script>
        /*SCRIPT*/
    </script>

</html>
